services:
  gifviewer:
    # Default to the published GHCR image. Override with GIFVIEWER_IMAGE env var.
    image: ${GIFVIEWER_IMAGE:-ghcr.io/thesamecat2/gifviewer:latest}
    pull_policy: always
    container_name: gifviewer
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - APP_NAME=GIF Viewer
      - MEDIA_ROOT=/media
      - DATA_ROOT=/data
      - DB_PATH=/data/gifviewer.db
      - THUMB_ROOT=/data/thumbnails
    volumes:
      - /path/to/your/media:/media:rw
      - gifviewer-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3

# To build locally instead of pulling, first build the image:
#   docker build -t localhost/gifviewer:latest .
# Then override the image via env var:
#   GIFVIEWER_IMAGE=localhost/gifviewer:latest docker compose up
volumes:
  gifviewer-data:
    driver: local
