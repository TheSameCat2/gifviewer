version: "3.8"

services:
  gifviewer:
    build: .
    container_name: gifviewer
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - APP_NAME=GIF Viewer
      - MEDIA_ROOT=/media
      - DATA_ROOT=/data
      - DB_PATH=/data/gifviewer.db
      - THUMB_ROOT=/data/thumbnails
    volumes:
      - /path/to/your/media:/media:rw
      - gifviewer-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  gifviewer-data:
    driver: local
